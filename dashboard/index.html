<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Drift — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f4f5f7;
      --surface:     #ffffff;
      --border:      rgba(0,0,0,0.07);
      --border-2:    rgba(0,0,0,0.11);
      --shadow-sm:   0 0 0 1px rgba(0,0,0,0.055), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-md:   0 0 0 1px rgba(0,0,0,0.06),  0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg:   0 0 0 1px rgba(0,0,0,0.07),  0 8px 32px rgba(0,0,0,0.12);
      --text:        #0d0f14;
      --text-2:      #374151;
      --text-3:      #6b7280;
      --text-4:      #9ca3af;
      --accent:      #5b5fc7;
      --accent-bg:   #eef0fd;
      --green:       #16a34a;
      --green-bg:    #f0fdf4;
      --amber:       #b45309;
      --amber-bg:    #fffbeb;
      --red:         #dc2626;
      --red-bg:      #fef2f2;
      --blue:        #2563eb;
      --blue-bg:     #eff6ff;
      --r:           8px;
      --r-lg:        12px;
      --r-xl:        16px;
      --font:        'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono:        ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace;
    }

    html { font-size: 14px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Topbar ─────────────────────────────────────────────────────────── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 56px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-icon svg { width: 14px; height: 14px; }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--border-2);
    }

    .repo-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      font-family: var(--mono);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.01em;
    }
    .status-badge .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-badge.ok   { color: var(--green); background: var(--green-bg); }
    .status-badge.warn { color: var(--amber); background: var(--amber-bg); }
    .status-badge.crit { color: var(--red);   background: var(--red-bg);   }

    .updated-label {
      font-size: 12px;
      color: var(--text-4);
    }

    /* ── Page ───────────────────────────────────────────────────────────── */
    .page {
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 32px 80px;
    }

    /* ── Section ────────────────────────────────────────────────────────── */
    .section { margin-bottom: 32px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .section-note {
      font-size: 12px;
      color: var(--text-4);
    }

    /* ── Metric cards ───────────────────────────────────────────────────── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 880px) { .metrics { grid-template-columns: repeat(2,1fr); } }

    .mcard {
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      padding: 22px 22px 18px;
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    .mcard:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .mcard:nth-child(1) { animation-delay: 0.04s; }
    .mcard:nth-child(2) { animation-delay: 0.08s; }
    .mcard:nth-child(3) { animation-delay: 0.12s; }
    .mcard:nth-child(4) { animation-delay: 0.16s; }

    .mcard-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
    }
    .mcard-accent.green  { background: linear-gradient(90deg,#16a34a,#4ade80); }
    .mcard-accent.amber  { background: linear-gradient(90deg,#b45309,#fbbf24); }
    .mcard-accent.blue   { background: linear-gradient(90deg,#2563eb,#60a5fa); }
    .mcard-accent.purple { background: linear-gradient(90deg,#5b5fc7,#a78bfa); }

    .mcard-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      letter-spacing: 0.03em;
      margin-bottom: 14px;
    }

    .mcard-value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }
    .mcard-value.green  { color: var(--green); }
    .mcard-value.amber  { color: var(--amber); }
    .mcard-value.blue   { color: var(--blue);  }
    .mcard-value.purple { color: var(--accent);}

    .mcard-sub {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 14px;
    }

    .progress-rail {
      height: 3px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 1s cubic-bezier(0.16,1,0.3,1);
    }
    .progress-fill.green  { background: linear-gradient(90deg,#16a34a,#4ade80); }
    .progress-fill.amber  { background: linear-gradient(90deg,#b45309,#fbbf24); }
    .progress-fill.red    { background: linear-gradient(90deg,#dc2626,#f87171); }

    /* ── Chart ──────────────────────────────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      padding: 24px 28px 20px;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 160px;
    }

    .chart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .chart-grid-line {
      stroke: var(--border);
      stroke-width: 1;
      stroke-dasharray: 3 4;
    }

    .chart-area {
      fill: url(#areaGrad);
      opacity: 0;
      transition: opacity 0.6s ease 0.8s;
    }
    .chart-area.visible { opacity: 1; }

    .chart-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-dot {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 2;
      r: 4;
      cursor: pointer;
      transition: r 0.15s ease;
    }
    .chart-dot:hover { r: 6; }

    .chart-tooltip {
      position: absolute;
      background: var(--text);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 9px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
      transform: translateX(-50%);
    }
    .chart-tooltip.show { opacity: 1; }

    .chart-x-labels {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      margin-top: 8px;
    }
    .chart-x-label {
      font-size: 10px;
      color: var(--text-4);
      font-family: var(--mono);
    }

    .chart-footer {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .chart-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chart-stat-value {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .chart-stat-label {
      font-size: 11px;
      color: var(--text-4);
    }

    .trend-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 99px;
    }
    .trend-chip.up   { background: var(--green-bg); color: var(--green); }
    .trend-chip.down { background: var(--red-bg);   color: var(--red);   }

    /* ── Table ──────────────────────────────────────────────────────────── */
    .table-card {
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.25s both;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 12px 20px;
      text-align: left;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody td {
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
      transition: background 0.1s;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.12s; }
    tbody tr:hover td { background: #fafbff; }

    /* ── Code / badges ───────────────────────────────────────────────────── */
    code {
      font-family: var(--mono);
      font-size: 11.5px;
      background: #f3f4f6;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 5px;
      padding: 2px 6px;
      color: var(--text-2);
    }

    .swatch-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 14px; height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .badge.fresh { background: var(--green-bg); color: var(--green); }
    .badge.aged  { background: var(--amber-bg); color: var(--amber); }
    .badge.stale { background: var(--red-bg);   color: var(--red);   }
    .badge.info  { background: var(--blue-bg);  color: var(--blue);  }
    .badge.dim   { background: #f3f4f6; color: var(--text-3); }

    .file-path { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
    .file-line { color: var(--text-4); }

    /* ── Pending cards ─────────────────────────────────────────────────── */
    .pending-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px,1fr));
      gap: 12px;
    }

    .pcard {
      background: var(--surface);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      transition: box-shadow 0.2s, transform 0.2s;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    }
    .pcard:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

    .pcard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .pcard-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .pcard-token {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .pcard-meta {
      font-size: 11px;
      color: var(--text-4);
    }

    .pcard-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: var(--r);
      border: 1px solid transparent;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all 0.15s;
    }
    .btn-approve {
      background: var(--green-bg);
      color: var(--green);
      border-color: rgba(22,163,74,0.2);
    }
    .btn-approve:hover { background: #dcfce7; }
    .btn-dismiss {
      background: #f3f4f6;
      color: var(--text-3);
      border-color: var(--border);
    }
    .btn-dismiss:hover { background: #e9eaec; }

    /* ── Empty ──────────────────────────────────────────────────────────── */
    .empty {
      padding: 48px 24px;
      text-align: center;
    }
    .empty-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--bg);
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      font-size: 16px;
    }
    .empty-title { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
    .empty-body  { font-size: 12px; color: var(--text-4); }

    /* ── Loading / error ─────────────────────────────────────────────────── */
    .loading-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 56px);
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .loading-label { font-size: 13px; color: var(--text-3); }

    .error-note {
      background: var(--red-bg);
      border: 1px solid rgba(220,38,38,0.15);
      border-radius: var(--r-lg);
      color: var(--red);
      font-size: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: none;
    }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Scrollbar ──────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 99px; }
  </style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="4" cy="4" r="2.5" fill="white"/>
          <circle cx="10" cy="4" r="2.5" fill="white" opacity=".6"/>
          <circle cx="4" cy="10" r="2.5" fill="white" opacity=".6"/>
          <circle cx="10" cy="10" r="2.5" fill="white" opacity=".3"/>
        </svg>
      </div>
      Token Drift
    </div>
    <div class="divider"></div>
    <span class="repo-label" id="hd-repo">loading…</span>
    <span id="hd-status"></span>
  </div>
  <div class="topbar-right">
    <span class="updated-label" id="hd-updated"></span>
  </div>
</header>

<!-- Loading state -->
<div class="loading-wrap" id="state-loading">
  <div class="spinner"></div>
  <div class="loading-label">Loading dashboard…</div>
</div>

<!-- Main -->
<div class="page" id="state-main" style="display:none">
  <div id="error-note" class="error-note"></div>

  <!-- Metrics -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">Overview</div>
      <div class="section-note" id="meta-scan"></div>
    </div>
    <div class="metrics">
      <div class="mcard">
        <div class="mcard-accent green"></div>
        <div class="mcard-label">Compliance Rate</div>
        <div class="mcard-value green" id="m-rate" data-suffix="%" data-target="0">0%</div>
        <div class="mcard-sub" id="m-rate-sub">Calculating…</div>
        <div class="progress-rail">
          <div class="progress-fill green" id="m-rate-bar" style="transform:scaleX(0)"></div>
        </div>
      </div>
      <div class="mcard">
        <div class="mcard-accent amber"></div>
        <div class="mcard-label">Violations Found</div>
        <div class="mcard-value amber" id="m-violations" data-target="0">0</div>
        <div class="mcard-sub">in last CI run</div>
      </div>
      <div class="mcard">
        <div class="mcard-accent blue"></div>
        <div class="mcard-label">Active Exceptions</div>
        <div class="mcard-value blue" id="m-exceptions" data-target="0">0</div>
        <div class="mcard-sub">intentional deviations</div>
      </div>
      <div class="mcard">
        <div class="mcard-accent purple"></div>
        <div class="mcard-label">Files Scanned</div>
        <div class="mcard-value purple" id="m-files" data-target="0">0</div>
        <div class="mcard-sub">source files checked</div>
      </div>
    </div>
  </div>

  <!-- Trend chart -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">Compliance Trend</div>
      <div class="section-note">8-week history</div>
    </div>
    <div class="chart-card">
      <div class="chart-wrap" id="chart-wrap">
        <div class="chart-tooltip" id="chart-tip"></div>
        <svg class="chart-svg" id="chart-svg" preserveAspectRatio="none">
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="chart-x-labels" id="chart-x"></div>
      <div class="chart-footer">
        <div class="chart-stat">
          <span class="chart-stat-value" id="cf-current">—</span>
          <span class="chart-stat-label">Current week</span>
        </div>
        <div class="chart-stat">
          <span class="chart-stat-value" id="cf-start">—</span>
          <span class="chart-stat-label">8 weeks ago</span>
        </div>
        <div class="chart-stat" style="margin-left:auto">
          <span id="cf-trend"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Exceptions -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">Active Exceptions</div>
      <div class="section-note" id="exc-note"></div>
    </div>
    <div class="table-card" id="exc-container"></div>
  </div>

  <!-- Pending -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">Pending Token Approvals</div>
      <div class="section-note" id="pend-note"></div>
    </div>
    <div id="pend-container"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── Utils ────────────────────────────────────────────────────────────── */

  const $ = id => document.getElementById(id);

  function esc(v) {
    return String(v ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function relTime(iso) {
    if (!iso) return '—';
    const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
    if (d < 1)  return 'today';
    if (d === 1) return 'yesterday';
    if (d < 30)  return d + ' days ago';
    const m = Math.floor(d / 30);
    return m + ' month' + (m > 1 ? 's' : '') + ' ago';
  }

  function ageBadge(iso) {
    if (!iso) return '';
    const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
    if (d < 14) return '<span class="badge fresh">Fresh</span>';
    if (d < 30) return '<span class="badge aged">Ageing</span>';
    return '<span class="badge stale">Stale</span>';
  }

  function isHex(v) { return /^#[0-9a-fA-F]{3,8}$/.test(String(v)); }

  function valueCell(v) {
    if (!isHex(v)) return `<code>${esc(v)}</code>`;
    return `<span class="swatch-wrap">
      <span class="swatch" style="background:${esc(v)}"></span>
      <code>${esc(v)}</code>
    </span>`;
  }

  function compClass(n) {
    return n >= 85 ? 'ok' : n >= 60 ? 'warn' : 'crit';
  }

  function compFillClass(n) {
    return n >= 85 ? 'green' : n >= 60 ? 'amber' : 'red';
  }

  /* ── Counter animation ────────────────────────────────────────────────── */

  function animateCount(el, target, suffix, duration) {
    duration = duration || 900;
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const e = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(target * e) + (suffix || '');
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ── Fetch ────────────────────────────────────────────────────────────── */

  function getJson(url) {
    return fetch(url).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
      return r.json();
    });
  }

  Promise.all([
    getJson('../token-exceptions.json').catch(() => ({})),
    getJson('../dashboard-data.json').catch(() => null),
    getJson('../pending-tokens.json').catch(() => ({})),
  ]).then(([exc, dash, pend]) => {
    $('state-loading').style.display = 'none';
    $('state-main').style.display    = 'block';
    render(exc || {}, dash, pend || {});
  }).catch(err => {
    $('state-loading').innerHTML = `
      <div style="text-align:center;color:var(--text-3)">
        <div style="font-size:14px;font-weight:500;color:var(--text-2);margin-bottom:6px">
          Could not load dashboard data
        </div>
        <div style="font-size:12px">${esc(err.message)}</div>
        <div style="font-size:12px;margin-top:10px;color:var(--text-4)">
          Serve from repo root:
          <code>python -m http.server 8000</code>
          then open
          <code>http://localhost:8000/dashboard/</code>
        </div>
      </div>`;
  });

  /* ── Render ───────────────────────────────────────────────────────────── */

  function render(exc, dash, pend) {
    const excArr  = Object.entries(exc);
    const pendArr = Object.entries(pend);

    const summary    = dash?.scan_summary ?? {};
    const compliance = summary.compliance_rate
      ?? Math.max(0, Math.min(100, 100 - excArr.length * 5));
    const violations = summary.violations_found ?? 0;
    const files      = summary.files_scanned     ?? 0;

    /* ── Header ─────────────────────────────────────────────────────────── */
    $('hd-repo').textContent = dash?.repository || 'local';

    const sc = compClass(compliance);
    const sl = sc === 'ok' ? 'Healthy' : sc === 'warn' ? 'Needs attention' : 'Critical';
    $('hd-status').innerHTML =
      `<span class="status-badge ${sc}">
         <span class="dot"></span>${sl}
       </span>`;

    $('hd-updated').textContent = dash?.generated_at
      ? 'Updated ' + relTime(dash.generated_at)
      : 'Local data';

    /* ── Metrics ─────────────────────────────────────────────────────────── */
    $('meta-scan').textContent = dash?.generated_at
      ? 'Last scan: ' + new Date(dash.generated_at).toLocaleString()
      : '';

    // Animate numbers after a short delay
    setTimeout(() => {
      animateCount($('m-rate'),       compliance, '%');
      animateCount($('m-violations'), violations, '');
      animateCount($('m-exceptions'), excArr.length, '');
      animateCount($('m-files'),      files, '');
    }, 100);

    // Progress bar
    const fc = compFillClass(compliance);
    const bar = $('m-rate-bar');
    bar.className = 'progress-fill ' + fc;
    setTimeout(() => { bar.style.transform = `scaleX(${compliance / 100})`; }, 200);

    $('m-rate-sub').textContent =
      compliance >= 85 ? 'Within target' :
      compliance >= 60 ? 'Below target'  : 'Action required';

    /* ── Chart ───────────────────────────────────────────────────────────── */
    const trend = dash?.weekly_trend ?? buildFallbackTrend(compliance);
    renderChart(trend);

    /* ── Exceptions ──────────────────────────────────────────────────────── */
    $('exc-note').textContent = excArr.length ? excArr.length + ' total' : 'All clear';
    renderExceptions(excArr);

    /* ── Pending ─────────────────────────────────────────────────────────── */
    $('pend-note').textContent = pendArr.length ? pendArr.length + ' awaiting review' : 'None';
    renderPending(pendArr);
  }

  /* ── Chart ────────────────────────────────────────────────────────────── */

  function buildFallbackTrend(current) {
    return Array.from({ length: 8 }, (_, i) => ({
      week: 'W' + String(i + 1).padStart(2, '0'),
      compliance: Math.max(0, Math.round(current - (7 - i) * 2.5)),
    }));
  }

  function smoothPath(pts) {
    if (pts.length < 2) return pts.map(p => `M${p.x},${p.y}`).join('');
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], c = pts[i];
      const t = (c.x - p.x) * 0.45;
      d += ` C${p.x + t},${p.y} ${c.x - t},${c.y} ${c.x},${c.y}`;
    }
    return d;
  }

  function renderChart(trend) {
    if (!trend || !trend.length) return;

    const wrap = $('chart-wrap');
    const svg  = $('chart-svg');
    const tip  = $('chart-tip');
    const W    = wrap.clientWidth  || 900;
    const H    = wrap.clientHeight || 160;
    const PAD  = { t: 16, r: 8, b: 8, l: 8 };
    const maxV = 100;
    const minV = Math.max(0, Math.min(...trend.map(t => t.compliance)) - 5);

    function px(val) { return H - PAD.b - ((val - minV) / (maxV - minV)) * (H - PAD.t - PAD.b); }
    function py(i)   { return PAD.l + i * ((W - PAD.l - PAD.r) / (trend.length - 1)); }

    const pts = trend.map((t, i) => ({ x: py(i), y: px(t.compliance), val: t.compliance, week: t.week }));

    // Grid lines
    const gridVals = [25, 50, 75, 100].filter(v => v >= minV);
    let gridHtml = gridVals.map(v => {
      const y = px(v);
      return `<line class="chart-grid-line" x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}"/>`;
    }).join('');

    // Area fill
    const areaPath = smoothPath(pts)
      + ` L${pts[pts.length-1].x},${H - PAD.b} L${pts[0].x},${H - PAD.b} Z`;

    // Line
    const linePath = smoothPath(pts);

    // Build line element for animation
    const lineId = 'cl' + Date.now();

    // Dots
    const dotsHtml = pts.map((p, i) =>
      `<circle class="chart-dot"
        cx="${p.x}" cy="${p.y}"
        data-i="${i}" data-week="${esc(p.week)}" data-val="${p.val}"/>`
    ).join('');

    svg.innerHTML = `
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridHtml}
      <path class="chart-area" d="${areaPath}"/>
      <path class="chart-line" id="${lineId}" d="${linePath}"/>
      ${dotsHtml}
    `;

    // Animate line draw
    const line = document.getElementById(lineId);
    if (line) {
      const len = line.getTotalLength();
      line.style.strokeDasharray  = len;
      line.style.strokeDashoffset = len;
      line.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { line.style.strokeDashoffset = '0'; });
      });
    }

    // Animate area
    setTimeout(() => {
      svg.querySelector('.chart-area')?.classList.add('visible');
    }, 600);

    // X labels
    $('chart-x').innerHTML = trend.map(t =>
      `<span class="chart-x-label">${esc(t.week)}</span>`
    ).join('');

    // Footer stats
    const first = trend[0]?.compliance ?? 0;
    const last  = trend[trend.length - 1]?.compliance ?? 0;
    const diff  = last - first;
    $('cf-current').textContent = last + '%';
    $('cf-start').textContent   = first + '%';
    $('cf-trend').innerHTML = diff !== 0
      ? `<span class="trend-chip ${diff > 0 ? 'up' : 'down'}">
           ${diff > 0 ? '↑' : '↓'} ${Math.abs(diff)}% over 8 weeks
         </span>`
      : '';

    // Dot hover tooltip
    svg.querySelectorAll('.chart-dot').forEach(dot => {
      dot.addEventListener('mouseenter', function (e) {
        const rect = wrap.getBoundingClientRect();
        const cx   = parseFloat(this.getAttribute('cx'));
        const cy   = parseFloat(this.getAttribute('cy'));
        const scaleX = W / (svg.clientWidth || W);
        const scaleY = H / (svg.clientHeight || H);
        tip.textContent = this.dataset.week + ': ' + this.dataset.val + '%';
        tip.style.left  = (cx / scaleX) + 'px';
        tip.style.top   = (cy / scaleY - 36) + 'px';
        tip.classList.add('show');
      });
      dot.addEventListener('mouseleave', () => tip.classList.remove('show'));
    });
  }

  /* ── Exceptions table ─────────────────────────────────────────────────── */

  function renderExceptions(entries) {
    const c = $('exc-container');
    if (!entries.length) {
      c.innerHTML = `<div class="empty">
        <div class="empty-icon">✓</div>
        <div class="empty-title">No active exceptions</div>
        <div class="empty-body">Every value in the codebase is using design tokens.</div>
      </div>`;
      return;
    }

    entries.sort((a, b) =>
      new Date(b[1].logged_date ?? 0) - new Date(a[1].logged_date ?? 0));

    const rows = entries.map(([key, e]) => {
      const file   = e.file || key.split('::')[0] || '—';
      const line   = e.line || key.split('::')[1] || '';
      const reason = e.reason
        ? `<span style="color:var(--text-2)">${esc(e.reason)}</span>`
        : `<span style="color:var(--text-4)">—</span>`;
      const age    = e.logged_date
        ? `${ageBadge(e.logged_date)} <span style="font-size:11px;color:var(--text-4);margin-left:4px">${relTime(e.logged_date)}</span>`
        : '—';
      return `<tr>
        <td>${valueCell(e.value ?? '—')}</td>
        <td><code>${esc(e.token_match ?? '—')}</code></td>
        <td>
          <span class="file-path">${esc(file)}</span>${line ? `<span class="file-line">:${esc(String(line))}</span>` : ''}
        </td>
        <td style="max-width:200px">${reason}</td>
        <td style="white-space:nowrap">${age}</td>
      </tr>`;
    }).join('');

    c.innerHTML = `<table>
      <thead><tr>
        <th>Value</th><th>Token</th><th>Location</th><th>Reason</th><th>Age</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  /* ── Pending approvals ─────────────────────────────────────────────────── */

  function renderPending(entries) {
    const c = $('pend-container');
    if (!entries.length) {
      c.innerHTML = `<div class="table-card"><div class="empty">
        <div class="empty-icon">◇</div>
        <div class="empty-title">No pending approvals</div>
        <div class="empty-body">
          Token suggestions from the VS Code extension appear here for team review.
        </div>
      </div></div>`;
      return;
    }

    const cards = entries.map(([name, e]) => {
      const typeTag = e.type === 'color'
        ? `<span class="badge info">Color</span>`
        : `<span class="badge dim">Dimension</span>`;

      return `<div class="pcard">
        <div class="pcard-head">
          <div class="pcard-value">${valueCell(e.value ?? name)}</div>
          ${typeTag}
        </div>
        <div class="pcard-token">${esc(name)}</div>
        <div class="pcard-meta">
          ${e.file ? `<span class="file-path">${esc(e.file)}</span>` : ''}
          ${e.suggested_date ? ' · ' + relTime(e.suggested_date) : ''}
        </div>
        <div class="pcard-actions">
          <button class="btn btn-approve" onclick="onApprove(${JSON.stringify(name)})">Approve</button>
          <button class="btn btn-dismiss" onclick="onDismiss(${JSON.stringify(name)})">Dismiss</button>
        </div>
      </div>`;
    }).join('');

    c.innerHTML = `<div class="pending-grid">${cards}</div>`;
  }

  /* ── Action handlers ─────────────────────────────────────────────────── */
  window.onApprove = function (name) {
    window.prompt(
      'Run in terminal to approve "' + name + '":',
      'node -e "const f=\'tokens.dtcg.json\',p=\'pending-tokens.json\',' +
      't=JSON.parse(require(\'fs\').readFileSync(f)),pe=JSON.parse(require(\'fs\').readFileSync(p)),' +
      'n=\'' + name + '\',parts=n.split(\'.\'),e=pe[n];let cur=t;' +
      'parts.slice(0,-1).forEach(k=>{cur[k]=cur[k]||{};cur=cur[k];});' +
      'cur[parts.at(-1)]={\'$value\':e.value,\'$type\':e.type};delete pe[n];' +
      'require(\'fs\').writeFileSync(f,JSON.stringify(t,null,2));' +
      'require(\'fs\').writeFileSync(p,JSON.stringify(pe,null,2));console.log(\'Done\')"'
    );
  };

  window.onDismiss = function (name) {
    window.prompt(
      'Run in terminal to dismiss "' + name + '":',
      'node -e "const p=\'pending-tokens.json\',d=JSON.parse(require(\'fs\').readFileSync(p));' +
      'delete d[\'' + name + '\'];require(\'fs\').writeFileSync(p,JSON.stringify(d,null,2));console.log(\'Dismissed\')"'
    );
  };

}());
</script>
</body>
</html>
